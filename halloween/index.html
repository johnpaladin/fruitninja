<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>幽靈萬聖節賣場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07040b; --panel: rgba(14, 8, 22, 0.86); --line: rgba(255, 122, 26, 0.35);
    --orange: #ff7a1a; --purple: #a560ff; --green: #79ff8a; --red: #ff2d3d;
    --text: #f4ecff; --muted: #a897c2;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07040b; } }
  :root[data-theme="dark"] { --bg: #07040b; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; padding: 24px 16px; text-align: center;
    background: radial-gradient(ellipse at center, rgba(40, 10, 50, .78), rgba(5, 2, 8, .95)); }
  .overlay.hidden { display: none; }
  .logo { font-family: "Creepster", cursive; font-size: clamp(44px, 11vw, 104px); line-height: .95; color: var(--orange);
    letter-spacing: 3px; text-shadow: 0 0 18px rgba(255, 110, 20, .8), 0 0 50px rgba(255, 60, 0, .45), 0 4px 0 #3a0d00; }
  .logo small { display: block; font-size: .42em; color: var(--purple); text-shadow: 0 0 16px rgba(165, 96, 255, .8); letter-spacing: 6px; }
  .sub { font-size: clamp(15px, 3.6vw, 19px); color: var(--muted); letter-spacing: 2px; }
  .controls { display: grid; grid-template-columns: auto auto; gap: 8px 18px; font-size: 15px; text-align: left;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 14px; padding: 14px 20px; max-width: 460px; }
  .controls b { color: var(--orange); font-weight: 700; white-space: nowrap; }
  .touch-only { display: none; }
  body.touch .touch-only { display: block; }
  body.touch .desk-only { display: none; }
  button.go { font: 900 clamp(18px, 4.6vw, 24px) "Noto Sans TC", sans-serif; color: #1a0700; letter-spacing: 3px;
    background: linear-gradient(180deg, #ffb35c, #ff6a00); border: none; border-radius: 999px; padding: 15px 46px;
    cursor: pointer; box-shadow: 0 0 30px rgba(255, 106, 0, .55), inset 0 -3px 0 rgba(0, 0, 0, .25); transition: transform .12s; }
  button.go:active { transform: scale(.95); }
  .note { font-size: 13px; color: #7d6f93; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud.hidden { display: none; }
  .brand { position: absolute; top: 12px; left: 16px; font-family: "Creepster", cursive; font-size: 26px; color: var(--orange);
    text-shadow: 0 0 12px rgba(255, 110, 20, .7); }
  #cart { position: absolute; top: 14px; right: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    padding: 7px 16px; font-size: 15px; font-weight: 700; }
  #cart span { color: var(--orange); }
  #cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255, 255, 255, .75); box-shadow: 0 0 6px rgba(255, 140, 40, .9); }
  body.touch #cross { display: none; }
  #prompt { position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--orange); border-radius: 12px; padding: 10px 18px; font-size: 17px; font-weight: 700;
    white-space: nowrap; box-shadow: 0 0 24px rgba(255, 106, 0, .35); opacity: 0; transition: opacity .2s; max-width: calc(100vw - 32px); }
  #prompt.show { opacity: 1; }
  @media (max-width: 640px) { #prompt { white-space: normal; font-size: 14px; bottom: 170px; text-align: center; width: max-content; } .brand { font-size: 20px; } }
  #prompt kbd { display: inline-block; background: var(--orange); color: #1a0700; border-radius: 6px; padding: 0 8px; margin: 0 3px; font-family: inherit; }
  #card { position: absolute; left: 16px; bottom: 16px; width: min(320px, calc(100vw - 32px)); background: var(--panel);
    border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: 12px; padding: 12px 16px;
    opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s; }
  #card.show { opacity: 1; transform: none; }
  #card h3 { font-size: 19px; }
  #card .en { font-size: 13px; color: var(--muted); letter-spacing: 1px; }
  #card .price { font-size: 24px; font-weight: 900; color: var(--orange); margin: 4px 0; }
  #card .tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px;
    background: var(--red); color: #fff; vertical-align: middle; }
  #card .tag.motion { background: var(--purple); }
  #card p { font-size: 14px; color: #d9cdea; line-height: 1.6; }
  body.touch #card { bottom: auto; top: 56px; }
  #toast { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 18px; font-weight: 900;
    color: var(--green); text-shadow: 0 0 12px rgba(121, 255, 138, .6); opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #toast.show { opacity: 1; }
  #scare { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(200, 0, 20, .65)); transition: opacity .5s; }
  #scare.on { opacity: 1; transition: opacity .05s; }

  #touchUI { position: fixed; inset: 0; z-index: 7; pointer-events: none; display: none; }
  body.touch.playing #touchUI { display: block; }
  #stick { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25);
    background: rgba(255, 255, 255, .06); left: 28px; bottom: 28px; }
  #knob { position: absolute; width: 52px; height: 52px; border-radius: 50%; left: 34px; top: 34px;
    background: rgba(255, 122, 26, .75); box-shadow: 0 0 14px rgba(255, 122, 26, .7); }
  .tbtn { position: absolute; pointer-events: auto; border: none; border-radius: 50%; font: 900 15px "Noto Sans TC", sans-serif;
    color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; }
  #tUse { right: 26px; bottom: 40px; width: 86px; height: 86px; background: radial-gradient(circle at 40% 35%, #ff6a6a, #c00018);
    box-shadow: 0 0 22px rgba(255, 30, 50, .7); }
  #tCart { right: 128px; bottom: 30px; width: 62px; height: 62px; background: rgba(165, 96, 255, .85); font-size: 22px; }

  #receipt .paper { background: #f6f1e7; color: #1d1424; width: min(360px, calc(100vw - 32px)); border-radius: 6px;
    padding: 22px 22px 18px; font-family: "Courier New", monospace; text-align: left; box-shadow: 0 0 40px rgba(255, 106, 0, .4); }
  #receipt h2 { font-family: "Creepster", cursive; color: #d24a00; text-align: center; font-size: 34px; font-weight: 400; }
  #receipt .row { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 3px 0; }
  #receipt .tot { border-top: 2px dashed #1d1424; margin-top: 8px; padding-top: 8px; font-weight: 700; font-size: 17px; }
  #receipt .thanks { text-align: center; margin-top: 12px; font-size: 13px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="brand">Phantom Halloween</div>
  <div id="cart">🛒 <span id="cartN">0</span> 件 · <span id="cartT">$0.00</span></div>
  <div id="cross"></div>
  <div id="prompt"></div>
  <div id="card"></div>
  <div id="toast"></div>
</div>
<div id="scare"></div>

<div id="touchUI">
  <div id="stick"><div id="knob"></div></div>
  <button class="tbtn" id="tCart">🛒</button>
  <button class="tbtn" id="tUse">TRY<br>ME</button>
</div>

<div class="overlay" id="start">
  <div class="logo">Phantom Halloween<small>幽靈萬聖節</small></div>
  <div class="sub">機械偶賣場 · 從停車場走進店裡,按下 TRY ME 試玩每一隻</div>
  <div class="controls desk-only">
    <b>W A S D</b><span>走動(Shift 快跑)</span>
    <b>滑鼠</b><span>環顧四周</span>
    <b>E / 點擊</b><span>按下 TRY ME 按鈕・櫃台結帳</span>
    <b>B</b><span>把眼前的機械偶放進購物車</span>
    <b>Esc</b><span>暫停</span>
  </div>
  <div class="controls touch-only">
    <b>左下搖桿</b><span>走動</span>
    <b>右半螢幕拖曳</b><span>環顧四周</span>
    <b>紅色按鈕</b><span>TRY ME・結帳</span>
    <b>🛒</b><span>放進購物車</span>
  </div>
  <button class="go" id="goBtn">進入賣場</button>
  <div class="note">🔊 建議開啟聲音・有些機械偶是「動作感應」的,小心靠近</div>
</div>

<div class="overlay hidden" id="pause">
  <div class="logo" style="font-size:clamp(40px,9vw,72px)">Paused<small>暫停中</small></div>
  <button class="go" id="resumeBtn">繼續逛</button>
</div>

<div class="overlay hidden" id="receipt">
  <div class="paper" id="paper"></div>
  <button class="go" id="closeReceipt">繼續逛</button>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// canvas textures draw text, so wait (briefly) for the web fonts first
await Promise.race([
  Promise.all(['100px Creepster', '900 60px "Noto Sans TC"', '400 60px "Noto Sans TC"'].map(f => document.fonts.load(f))).catch(() => {}),
  new Promise(r => setTimeout(r, 3000))
]);

// ---------- renderer / scene ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07040b);
scene.fog = new THREE.FogExp2(0x100818, 0.028);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 400);
camera.rotation.order = 'YXZ';
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.45, 0.5, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const H = 4.6, X0 = -15, X1 = 15, Z0 = -24, Z1 = 15;
const PI = Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = x => { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); };

// ---------- helpers ----------
const M = (color, rough = 0.8, metal = 0, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
const B = color => new THREE.MeshBasicMaterial({ color });
function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m;
}
function group(parent, x = 0, y = 0, z = 0) {
  const g = new THREE.Group(); g.position.set(x, y, z); parent.add(g); return g;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const stripeTex = (a, b, n) => canvasTex(256, 64, (g, w, h) => {
  for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? b : a; g.fillRect(i * w / n, 0, w / n + 1, h); }
});
const plaidTex = () => canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#7a1c1c'; g.fillRect(0, 0, w, h);
  g.globalAlpha = .5; g.fillStyle = '#2a0f0f';
  for (let i = 0; i < 4; i++) { g.fillRect(i * 32 + 10, 0, 10, h); g.fillRect(0, i * 32 + 10, w, 10); }
  g.globalAlpha = .35; g.fillStyle = '#e8c070';
  for (let i = 0; i < 4; i++) { g.fillRect(i * 32 + 26, 0, 2, h); g.fillRect(0, i * 32 + 26, w, 2); }
});
function signTex(lines, { w = 1024, h = 512, bg = null, border = null, glow = 0 } = {}) {
  return canvasTex(w, h, (g) => {
    if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
    if (border) { g.strokeStyle = border; g.lineWidth = 14; g.strokeRect(10, 10, w - 20, h - 20); }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    for (const l of lines) {
      g.font = l.font; g.fillStyle = l.color;
      g.shadowColor = l.color; g.shadowBlur = glow;
      g.fillText(l.t, w / 2, l.y * h);
    }
  });
}

// ---------- room ----------
const floorTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#17121c'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2b2233'; g.fillRect(0, 0, w / 2, h / 2); g.fillRect(w / 2, h / 2, w / 2, h / 2);
  g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 3; g.strokeRect(0, 0, w, h); g.strokeRect(0, 0, w / 2, h / 2); g.strokeRect(w / 2, h / 2, w / 2, h / 2);
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set((X1 - X0) / 2, (Z1 - Z0) / 2);
const floor = add(scene, new THREE.PlaneGeometry(X1 - X0, Z1 - Z0), M(0xffffff, 0.35, 0.1, { map: floorTex }), 0, 0, (Z0 + Z1) / 2);
floor.rotation.x = -PI / 2;
const ceil = add(scene, new THREE.PlaneGeometry(X1 - X0, Z1 - Z0), M(0x15111a, 1), 0, H, (Z0 + Z1) / 2);
ceil.rotation.x = PI / 2;

const wallMat = M(0x241a2e, 0.95);
add(scene, new THREE.BoxGeometry(0.3, H, Z1 - Z0), wallMat, X0, H / 2, (Z0 + Z1) / 2);
add(scene, new THREE.BoxGeometry(0.3, H, Z1 - Z0), wallMat, X1, H / 2, (Z0 + Z1) / 2);
add(scene, new THREE.BoxGeometry(X1 - X0, H, 0.3), wallMat, 0, H / 2, Z0);

// LED strips along the walls
const ledO = B(0xff6a10), ledP = B(0x9a40ff);
for (const [x, z, w, d] of [[X0 + 0.17, (Z0 + Z1) / 2, 0.04, Z1 - Z0], [X1 - 0.17, (Z0 + Z1) / 2, 0.04, Z1 - Z0], [0, Z0 + 0.17, X1 - X0, 0.04], [0, Z1 - 0.17, X1 - X0, 0.04]]) {
  add(scene, new THREE.BoxGeometry(w, 0.06, d), ledO, x, 0.06, z);
  add(scene, new THREE.BoxGeometry(w, 0.06, d), ledP, x, H - 0.12, z);
}


// signs
const welcome = add(scene, new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({
  map: signTex([
    { t: 'PHANTOM HALLOWEEN', font: '150px Creepster, cursive', color: '#ff7a1a', y: .42 },
    { t: '幽 靈 萬 聖 節 ・ 歡 迎 光 臨', font: '900 70px "Noto Sans TC", sans-serif', color: '#c58bff', y: .8 }
  ], { glow: 30 }), transparent: true
}), 0, 3.86, Z1 - 0.06);
welcome.rotation.y = PI; welcome.scale.setScalar(0.78);
const neon = add(scene, new THREE.PlaneGeometry(10, 1.6), new THREE.MeshBasicMaterial({
  map: signTex([
    { t: 'ANIMATRONICS', font: '170px Creepster, cursive', color: '#79ff8a', y: .4 },
    { t: '機 械 偶 專 區 ・ 請 按 TRY ME', font: '900 72px "Noto Sans TC", sans-serif', color: '#ff7a1a', y: .82 }
  ], { glow: 36 }), transparent: true
}), 0, 3.7, Z0 + 0.17);
const hangMat = (lines) => new THREE.MeshBasicMaterial({ map: signTex(lines, { w: 1024, h: 384, bg: '#1a0b22', border: '#ff7a1a' }), side: THREE.DoubleSide });
function hangSign(x, z, rotY, cn, en) {
  const g = group(scene, x, 3.35, z); g.rotation.y = rotY;
  add(g, new THREE.PlaneGeometry(2.6, 0.95), hangMat([
    { t: cn, font: '900 130px "Noto Sans TC", sans-serif', color: '#ffffff', y: .42 },
    { t: en, font: '80px Creepster, cursive', color: '#ff7a1a', y: .8 }]));
  for (const sx of [-1.1, 1.1]) add(g, new THREE.CylinderGeometry(0.008, 0.008, H - 3.35), B(0x555555), sx, (H - 3.35) / 2 + 0.47, 0);
}
hangSign(-6, -4, 0, '面具・服裝', 'MASKS & COSTUMES');
hangSign(6, -4, 0, '居家裝飾', 'HOME DECOR');
hangSign(-10.5, -16, PI / 2, '機械偶', 'ANIMATRONICS');
hangSign(10.5, -16, -PI / 2, '機械偶', 'ANIMATRONICS');

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x6a4a90, 0.9));
scene.add(new THREE.HemisphereLight(0x8a66c0, 0x1a0c08, 0.7));
const ceilLights = [];
const panelGeo = new THREE.BoxGeometry(1.8, 0.05, 0.5);
for (const x of [-9, 0, 9]) for (const z of [-19, -11, -3, 5, 11]) {
  const mat = B(0xcfe0ff);
  add(scene, panelGeo, mat, x, H - 0.03, z);
  ceilLights.push({ mat, flicker: Math.random() < 0.22, phase: rand(0, 100) });
}
const roomLights = [];
for (const [x, z] of [[-6, -15], [6, -15], [-6, 1], [6, 1], [0, 10]]) {
  const l = new THREE.PointLight(0xc8d4ff, 9, 22, 1.2); l.position.set(x, H - 0.4, z); scene.add(l); roomLights.push(l);
}

// ---------- collision ----------
const boxes = [];
const solid = (x0, x1, z0, z1) => boxes.push({ x0, x1, z0, z1 });

// ---------- shelves with merchandise ----------
const boxGeo = new THREE.BoxGeometry(1, 1, 1);
const sphGeo = new THREE.SphereGeometry(1, 12, 10);
const maxInst = 1400;
const instBox = new THREE.InstancedMesh(boxGeo, M(0xffffff, 0.6), maxInst);
const instPumpkin = new THREE.InstancedMesh(sphGeo, M(0xff7a1a, 0.6, 0, { emissive: 0x401000 }), maxInst);
const instSkull = new THREE.InstancedMesh(sphGeo, M(0xe8dfc8, 0.7), maxInst);
let nBox = 0, nPump = 0, nSkull = 0;
const dummy = new THREE.Object3D();
const boxColors = [0xff7a1a, 0x7b2fff, 0x2bd96b, 0x111111, 0xd61e2b, 0xf2f2f2, 0x3a8dff, 0x5b1a7a].map(c => new THREE.Color(c));
function putItem(x, y, z) {
  const r = Math.random();
  if (r < 0.62) {
    const w = rand(0.18, 0.28), hh = rand(0.24, 0.42), d = rand(0.18, 0.28);
    dummy.position.set(x, y + hh / 2, z); dummy.scale.set(w, hh, d); dummy.rotation.set(0, rand(-0.1, 0.1), 0); dummy.updateMatrix();
    instBox.setMatrixAt(nBox, dummy.matrix); instBox.setColorAt(nBox, boxColors[(Math.random() * boxColors.length) | 0]); nBox++;
  } else if (r < 0.82) {
    const s = rand(0.1, 0.15);
    dummy.position.set(x, y + s * 0.8, z); dummy.scale.set(s * 1.15, s * 0.85, s * 1.15); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
    instPumpkin.setMatrixAt(nPump++, dummy.matrix);
  } else if (r < 0.95) {
    const s = rand(0.09, 0.12);
    dummy.position.set(x, y + s, z); dummy.scale.set(s, s * 1.1, s * 1.2); dummy.rotation.set(0, 0, 0); dummy.updateMatrix();
    instSkull.setMatrixAt(nSkull++, dummy.matrix);
  }
}
const shelfMat = M(0x2e2a33, 0.6, 0.5), plankMat = M(0x3b3640, 0.7, 0.3);
function shelfUnit(x, za, zb) {
  const len = zb - za, zc = (za + zb) / 2;
  add(scene, new THREE.BoxGeometry(1.3, 0.15, len), shelfMat, x, 0.075, zc);
  add(scene, new THREE.BoxGeometry(0.06, 2.5, len), shelfMat, x, 1.25, zc);

function cobweb(x, y, z, rotY, size = 2) {
  const pts = [];
  const N = 7, R = 5;
  for (let i = 0; i <= N; i++) { const a = (i / N) * PI / 2; pts.push(0, 0, 0, Math.cos(a) * size, -Math.sin(a) * size, 0); }
  for (let r = 1; r <= R; r++) {
    const rr = (r / R) * size;
    for (let i = 0; i < N; i++) {
      const a0 = (i / N) * PI / 2, a1 = ((i + 1) / N) * PI / 2, sag = 0.88;
      const am = (a0 + a1) / 2;
      pts.push(Math.cos(a0) * rr, -Math.sin(a0) * rr, 0, Math.cos(am) * rr * sag, -Math.sin(am) * rr * sag, 0);
      pts.push(Math.cos(am) * rr * sag, -Math.sin(am) * rr * sag, 0, Math.cos(a1) * rr, -Math.sin(a1) * rr, 0);
    }
  }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const l = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0xcfc8e0, transparent: true, opacity: 0.45 }));
  l.position.set(x, y, z); l.rotation.y = rotY; scene.add(l);
}

function updateExterior(t, dt) {
  // marquee chase with one flaky bulb
  const sg = signGroup.userData;
  for (let i = 0; i < sg.N; i++) {
    let on = ((i + Math.floor(t * 8)) % 3) === 0 ? 1 : 0.25;
    if (i === sg.dead) on = Math.random() < 0.08 ? 1 : 0.05;
    sg.bulbs.setColorAt(i, new THREE.Color(on, on * 0.8, on * 0.3));
  }
  sg.bulbs.instanceColor.needsUpdate = true;
  sg.lm.color.setScalar(1.7 * (Math.random() < 0.004 ? 0.35 : 1));
  for (const c of clouds) { c.position.x += dt * 1.2; if (c.position.x > 170) c.position.x = -170; }
  const flash = lightning > 0 && Math.random() < 0.5;
  skyMat.color.setScalar(flash ? 3.5 : 1);
  moonLight.intensity = flash ? 3 : 0.35;
  for (const s of treeSway) { s.crown.rotation.z = Math.sin(t * 0.8 + s.ph) * 0.012; s.crown.rotation.x = Math.sin(t * 0.6 + s.ph) * 0.01; }
  for (let i = 0; i < MOTHS; i++) {
    const h = lampHeads[(i / 6) | 0], a = t * (2 + (i % 5)) + i * 1.7;
    mothPos[i * 3] = h.x + Math.cos(a) * (0.4 + (i % 3) * 0.15); mothPos[i * 3 + 1] = h.y - 0.3 + Math.sin(a * 1.3) * 0.25; mothPos[i * 3 + 2] = h.z + Math.sin(a) * 0.4;
  }
  mothGeo.attributes.position.needsUpdate = true;
  for (const c of roofCrows) {
    const p = Math.max(0, Math.sin(t * 1.3 + c.ph)) ** 10;
    c.head.rotation.x = p * 0.6; c.head.rotation.y = Math.sin(t * 0.5 + c.ph) * 0.8;
    c.ceye.color.setRGB(0.5 + 0.5 * Math.max(0, Math.sin(t * 0.7 + c.ph)), 0.05, 0.05);
  }
  const inf = scene.userData.inflatable;
  inf.pk.scale.y = 1.05 + Math.sin(t * 1.7) * 0.015; inf.mat.emissiveIntensity = 1.5 + Math.sin(t * 9) * 0.15;
}

  if (p.z < Z1) p.x = clamp(p.x, X0 + 0.5, X1 - 0.5); else p.x = clamp(p.x, EXT.x0, EXT.x1);
  p.z = clamp(p.z, Z0 + 0.5, EXT.z1);
  const all = doorAmt < 0.6 ? boxes.concat([{ x0: -DOORW, x1: DOORW, z0: Z1 - 0.1, z1: Z1 + 0.45 }]) : boxes;
  for (const b of all) {
    if (p.x > b.x0 - r && p.x < b.x1 + r && p.z > b.z0 - r && p.z < b.z1 + r) {
      const dx0 = p.x - (b.x0 - r), dx1 = (b.x1 + r) - p.x, dz0 = p.z - (b.z0 - r), dz1 = (b.z1 + r) - p.z;
      const m = Math.min(dx0, dx1, dz0, dz1);
      if (m === dx0) p.x = b.x0 - r; else if (m === dx1) p.x = b.x1 + r; else if (m === dz0) p.z = b.z0 - r; else p.z = b.z1 + r;
    }
  }
}
function movePlayer(dt) {
  let fx = 0, fz = 0;
  if (keys.KeyW || keys.ArrowUp) fz += 1;
  if (keys.KeyS || keys.ArrowDown) fz -= 1;
  if (keys.KeyA || keys.ArrowLeft) fx -= 1;
  if (keys.KeyD || keys.ArrowRight) fx += 1;
  if (joy.id !== null) { fx += joy.x; fz += -joy.y; }
  const len = Math.hypot(fx, fz); if (len > 1) { fx /= len; fz /= len; }
  const speed = (keys.ShiftLeft || keys.ShiftRight) ? 5.2 : 2.9;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const tx = (-sy * fz + cy * fx) * speed, tz = (-cy * fz - sy * fx) * speed;
  const blend = 1 - Math.exp(-dt * 10);
  player.vel.x += (tx - player.vel.x) * blend; player.vel.z += (tz - player.vel.z) * blend;
  player.pos.x += player.vel.x * dt; player.pos.z += player.vel.z * dt;
  collide(player.pos);
  const onWalk = player.pos.z > Z1 + 0.3 && player.pos.z < SIDEWALK ? 0.12 : 0;
  player.y += (onWalk - player.y) * Math.min(1, dt * 10);
  const sp = Math.hypot(player.vel.x, player.vel.z);
  player.bob += sp * dt * 2.2;
  shake = Math.max(0, shake - dt * 1.4);
  camera.position.set(
    player.pos.x + (Math.random() - 0.5) * shake * 0.12,
    1.65 + player.y + Math.sin(player.bob * 2) * 0.035 * Math.min(1, sp / 3) + (Math.random() - 0.5) * shake * 0.12,
    player.pos.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
}

// ---------- input ----------
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!started || paused) return;
  if (e.code === 'KeyE') interact();
  if (e.code === 'KeyB') addToCart();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  player.yaw -= e.movementX * 0.0022;
  player.pitch = clamp(player.pitch - e.movementY * 0.0022, -1.3, 1.3);
});
canvas.addEventListener('click', () => {
  if (!started || isTouch) return;
  if (document.pointerLockElement !== canvas) canvas.requestPointerLock();
  else interact();
});
document.addEventListener('pointerlockchange', () => {
  if (isTouch || !started) return;
  if (document.pointerLockElement !== canvas && !receiptOpen) { paused = true; $('pause').classList.remove('hidden'); }
});
const knob = document.getElementById('knob'), stickEl = document.getElementById('stick');
canvas.addEventListener('touchstart', e => {
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth * 0.45 && joy.id === null) {
      joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY; joy.x = joy.y = 0;
      stickEl.style.left = (t.clientX - 60) + 'px'; stickEl.style.top = (t.clientY - 60) + 'px'; stickEl.style.bottom = 'auto';
    } else if (look.id === null) { look.id = t.identifier; look.x = t.clientX; look.y = t.clientY; }
  }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy; const d = Math.hypot(dx, dy), m = 50;
      if (d > m) { dx *= m / d; dy *= m / d; }
      joy.x = dx / m; joy.y = dy / m;
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
    } else if (t.identifier === look.id) {
      player.yaw -= (t.clientX - look.x) * 0.006;
      player.pitch = clamp(player.pitch - (t.clientY - look.y) * 0.006, -1.3, 1.3);
      look.x = t.clientX; look.y = t.clientY;
    }
  }
  e.preventDefault();
}, { passive: false });
const endTouch = e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      joy.id = null; joy.x = joy.y = 0; knob.style.transform = '';
      stickEl.style.left = '28px'; stickEl.style.top = 'auto'; stickEl.style.bottom = '28px';
    }
    if (t.identifier === look.id) look.id = null;
  }
};
canvas.addEventListener('touchend', endTouch); canvas.addEventListener('touchcancel', endTouch);
document.getElementById('tUse').addEventListener('touchstart', e => { e.preventDefault(); interact(); }, { passive: false });
document.getElementById('tCart').addEventListener('touchstart', e => { e.preventDefault(); addToCart(); }, { passive: false });
document.getElementById('tUse').addEventListener('click', interact);
document.getElementById('tCart').addEventListener('click', addToCart);

// ---------- UI ----------
const $ = id => document.getElementById(id);
const promptEl = $('prompt'), cardEl = $('card'), toastEl = $('toast'), scareEl = $('scare');
const cart = [];
let nearBtn = null, nearProduct = null, nearCounter = false, receiptOpen = false, toastT = 0, lastCard = null, lastPrompt = '';
function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show'); toastT = 1.8; }
function refreshCart() {
  $('cartN').textContent = cart.length;
  $('cartT').textContent = '$' + cart.reduce((s, d) => s + d.price, 0).toFixed(2);
}
function interact() {
  if (!started || paused) return;
  if (nearBtn) {
    if (!trigger(nearBtn)) toast('它還在動…等一下再按');
    return;
  }
  if (nearCounter) checkout();
}
function addToCart() {
  if (!started || paused || !nearProduct) return;
  cart.push(nearProduct.def); refreshCart(); play2D('chime');
  toast(`已加入購物車:${nearProduct.def.cn}`);
}
function checkout() {
  if (!cart.length) { toast('購物車是空的・按 B 把機械偶加入購物車'); return; }
  play2D('chime');
  const counts = {};
  for (const d of cart) counts[d.id] = (counts[d.id] || 0) + 1;
  const sub = cart.reduce((s, d) => s + d.price, 0), tax = sub * 0.05;
  const rows = Object.entries(counts).map(([id, n]) => `<div class="row"><span>${byId[id].cn} ×${n}</span><span>$${(byId[id].price * n).toFixed(2)}</span></div>`).join('');
  $('paper').innerHTML = `<h2>Phantom Halloween</h2><div class="row" style="justify-content:center">幽靈萬聖節 ・ 收據 #${(Math.random() * 1e6 | 0).toString().padStart(6, '0')}</div><br>${rows}
    <div class="row tot"><span>小計</span><span>$${sub.toFixed(2)}</span></div>
    <div class="row"><span>稅 5%</span><span>$${tax.toFixed(2)}</span></div>
    <div class="row tot"><span>總計</span><span>$${(sub + tax).toFixed(2)}</span></div>
    <div class="thanks">🎃 感謝光臨・祝你嚇到所有鄰居 🦇<br>(這是虛擬賣場,不會真的扣款)</div>`;
  cart.length = 0; refreshCart();
  receiptOpen = true; paused = true;
  if (document.pointerLockElement) document.exitPointerLock();
  $('receipt').classList.remove('hidden');
}
$('closeReceipt').addEventListener('click', () => {
  $('receipt').classList.add('hidden'); receiptOpen = false; resume();
});
function resume() {
  paused = false; $('pause').classList.add('hidden');
  if (!isTouch) canvas.requestPointerLock();
  clock.getDelta();
}
$('resumeBtn').addEventListener('click', resume);
$('goBtn').addEventListener('click', () => {
  initAudio();
  started = true; $('start').classList.add('hidden'); $('hud').classList.remove('hidden');
  document.body.classList.add('playing');
  if (!isTouch) canvas.requestPointerLock();
  clock.getDelta();
});

function updateUI(dt) {
  const p = player.pos;
  nearBtn = null; nearProduct = null;
  let bd = 2.3, pd = 6.5;
  _f.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  for (const f of figures) {
    if (f.btn) { const d = Math.hypot(p.x - f.btnWorld.x, p.z - f.btnWorld.z); if (d < bd) { bd = d; nearBtn = f; } }
    const dx = f.root.position.x - p.x, dz = f.root.position.z - p.z, d = Math.hypot(dx, dz);
    const facing = (dx * _f.x + dz * _f.z) / (d || 1);
    if (d < pd && facing > 0.55) { pd = d; nearProduct = f; }
  }
  if (nearBtn) nearProduct = nearBtn;
  nearCounter = Math.abs(p.x - counter.x) < 2.6 && p.z > counter.z - 2.2 && p.z < counter.z + 2.2;

  let msg = '';
  const useKey = isTouch ? '紅色按鈕' : 'E';
  const cartKey = isTouch ? '🛒' : 'B';
  if (nearBtn) msg = nearBtn.a >= 0 ? '😱 啟動中…' : `<kbd>${useKey}</kbd> 按下 TRY ME 試玩　<kbd>${cartKey}</kbd> 加入購物車`;
  else if (nearCounter) msg = `<kbd>${useKey}</kbd> 結帳(購物車 ${cart.length} 件)`;
  else if (nearProduct) msg = nearProduct.def.motion ? `⚡ 動作感應款・走近一點試試…　<kbd>${cartKey}</kbd> 加入購物車` : `<kbd>${cartKey}</kbd> 加入購物車・走到 TRY ME 按鈕旁試玩`;
  if (msg !== lastPrompt) { promptEl.innerHTML = msg; lastPrompt = msg; }
  promptEl.classList.toggle('show', !!msg);

  if (nearProduct !== lastCard) {
    lastCard = nearProduct;
    if (nearProduct) {
      const d = nearProduct.def;
      cardEl.innerHTML = `<h3>${d.cn}<span class="tag ${d.motion ? 'motion' : ''}">${d.motion ? '動作感應' : 'TRY ME'}</span></h3>
        <div class="en">${d.en} · ${d.height}</div><div class="price">$${d.price.toFixed(2)}</div><p>${d.desc}</p>`;
    }
    cardEl.classList.toggle('show', !!nearProduct);
  }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('show'); }
}

// ---------- main loop ----------
const clock = new THREE.Clock();
let t = 0, nextThunder = 18;
function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) {
    t += dt;
    if (started) movePlayer(dt); else {
      // attract-mode camera drift on title screen
      player.yaw = Math.sin(t * 0.13) * 0.25; player.pitch = 0.12;
      camera.position.set(Math.sin(t * 0.1) * 6, 1.8, 36 - Math.sin(t * 0.07) * 6);
      camera.rotation.set(player.pitch, player.yaw, 0);
    }
    updateListener();
    updateExterior(t, dt);
    // automatic sliding doors
    const want = started && Math.hypot(player.pos.x, player.pos.z - (Z1 + 0.2)) < 3.4;
    if (want && !doorWant) { play3D('chime', new THREE.Vector3(0, 2.8, Z1 + 0.2)); play3D('whoosh', new THREE.Vector3(0, 1.4, Z1 + 0.2)); }
    doorWant = want;
    doorAmt = clamp(doorAmt + (want ? dt * 1.6 : -dt * 1.1), 0, 1);
    for (const d of doors) d.g.position.x = d.s * (DOORW / 2 + smooth(doorAmt) * 1.42);
    if (AC) {
      const pz = started ? player.pos.z : 40;
      const inside = pz < Z1 ? 1 : clamp(1 - (pz - Z1) / 8, 0, 1) * (0.4 + 0.6 * doorAmt);
      musicBus.gain.value = 0.12 + 0.88 * inside; outBus.gain.value = 1 - 0.85 * inside;
      if (t > nextCar) { nextCar = t + rand(22, 40); if (pz > Z1) carPass(); }
    }

    for (const f of figures) {
      if (f.a >= 0) { f.a += dt; if (f.a > f.def.dur) { f.a = -1; f.cool = 6; } }
      else if (f.cool > 0) f.cool -= dt;
      else if (started && f.def.motion) {
        const d = Math.hypot(player.pos.x - f.front.x, player.pos.z - f.front.z);
        if (d < 2.6) {
          trigger(f);
          shake = 0.9; scareEl.classList.add('on'); setTimeout(() => scareEl.classList.remove('on'), 160);
        }
      }
      const k = envK(f);
      f.fig.update(t + f.seed, k, f.a, dt);
      const flick = k > 0 ? (0.6 + 0.4 * Math.sin(t * 40 + f.seed) * (Math.random() < 0.3 ? -1 : 1)) : 1;
      f.light.intensity = 3 + 2 * Math.sin(t * 1.5 + f.seed) * 0.3 + 30 * k * flick;
      for (const e of f.fig.eyes) e.color.copy(f.fig.eyeColor).multiplyScalar(0.35 + 0.65 * Math.max(k, 0.25 + 0.15 * Math.sin(t * 2 + f.seed)));
      if (f.btn) f.btn.capMat.emissiveIntensity = f.a >= 0 ? 0.15 : 0.35 + 0.3 * Math.sin(t * 5);
      if (f.def.id === 'wolf' && f.a > 0.8 && f.a < 0.85 && Math.hypot(player.pos.x - f.front.x, player.pos.z - f.front.z) < 3.5) {
        shake = 0.7; scareEl.classList.add('on'); setTimeout(() => scareEl.classList.remove('on'), 160);
      }
    }

    // fluorescent flicker + lightning
    if (lightning > 0) lightning -= dt;
    for (const c of ceilLights) {
      let v = 1;
      if (c.flicker) { const n = Math.sin(t * 13 + c.phase) + Math.sin(t * 31 + c.phase * 2); v = n > 1.3 ? 0.1 : (Math.random() < 0.03 ? 0.2 : 1); }
      if (lightning > 0 && Math.random() < 0.5) v = 1.6;
      c.mat.color.setRGB(0.81 * v, 0.88 * v, v);
    }
    for (const [i, l] of roomLights.entries()) l.intensity = (lightning > 0 && Math.random() < 0.5) ? 30 : 9 + (i === 2 ? Math.sin(t * 17) * 2 : 0);
    if (t > nextThunder) { thunder(); nextThunder = t + rand(25, 45); }

    // bats
    for (const b of bats) {
      const a = t * b.sp + b.ph;
      b.g.position.set(b.cx + Math.cos(a) * b.r, b.y + Math.sin(t * 2 + b.ph) * 0.15, b.cz + Math.sin(a) * b.r);
      b.g.rotation.y = -a + (b.sp > 0 ? 0 : PI);
      const fl = Math.sin(t * 18 + b.ph) * 0.8;
      b.pl.rotation.z = fl; b.pr.rotation.z = -fl;
    }
    // fog drift
    for (let i = 0; i < FOGN; i++) {
      fogPos[i * 3] += fogVel[i * 2] * dt; fogPos[i * 3 + 2] += fogVel[i * 2 + 1] * dt;
      if (fogPos[i * 3] < X0 + 0.5 || fogPos[i * 3] > X1 - 0.5) fogVel[i * 2] *= -1;
      if (fogPos[i * 3 + 2] < Z0 + 0.5 || fogPos[i * 3 + 2] > Z1 - 0.5) fogVel[i * 2 + 1] *= -1;
    }
    fogGeo.attributes.position.needsUpdate = true;
    // table pumpkins pulse
    for (const [i, p] of tablePumpkins.entries()) p.material.emissiveIntensity = 0.6 + 0.4 * Math.sin(t * 3 + i);
    // cashier
    const cd = Math.hypot(player.pos.x - counter.x, player.pos.z - counter.z);
    cashier.head.rotation.y = Math.sin(t * 0.8) * 0.4;
    cashier.jaw.position.y = -0.14 - (cd < 5 ? 0.04 * Math.abs(Math.sin(t * 12)) : 0);
    cashier.arms[1].rotation.z = cd < 5 ? 2.4 + Math.sin(t * 8) * 0.4 : 0.2;

    if (started) updateUI(dt);
  }
  composer.render();
}
tick();
</script>
