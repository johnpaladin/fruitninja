<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>手勢切水果 Fruit Ninja</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0e1a; font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; }
  #video { display: none; }
  #canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(8, 10, 22, 0.82); color: #fff; text-align: center;
    padding: 24px; z-index: 10; backdrop-filter: blur(6px);
  }
  .overlay.hidden { display: none; }
  h1 { font-size: clamp(30px, 6vw, 52px); letter-spacing: 2px; }
  h1 .knife { display: inline-block; transform: rotate(-15deg); }
  .sub { font-size: clamp(15px, 3vw, 19px); line-height: 1.9; color: #cdd3ea; max-width: 520px; }
  .sub b { color: #ffd166; }
  button.big {
    font-size: clamp(18px, 4vw, 24px); font-weight: 700; color: #1a1a2e;
    background: linear-gradient(135deg, #ffd166, #ff8fab);
    border: none; border-radius: 999px; padding: 16px 44px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(255, 150, 120, .35);
    transition: transform .15s;
  }
  button.big:active { transform: scale(.95); }
  #status { font-size: 15px; color: #8fd3ff; min-height: 22px; }
  #finalScore { font-size: clamp(48px, 12vw, 96px); font-weight: 800; color: #ffd166; }
  #bestScore { color: #8fd3ff; font-size: 17px; }
  .tip { font-size: 13px; color: #7a819e; max-width: 480px; line-height: 1.7; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>

<div id="startOverlay" class="overlay">
  <h1><span class="knife">🔪</span> 手勢切水果</h1>
  <div class="sub">
    對著鏡頭伸出手,你的<b>食指指尖</b>就是刀子!<br>
    <b>快速揮動</b>劃過水果就能切開它 🍉🍎🍌<br>
    小心 💣 炸彈,切到會 <b>-30 分</b>!限時 <b>60 秒</b>,拿越高分越好!
  </div>
  <button id="startBtn" class="big">開始遊戲</button>
  <div id="status"></div>
  <div class="tip">需要允許使用攝影機。手機請直立拿好,離鏡頭約 50–100 公分,雙手都可以當刀哦!</div>
</div>

<div id="overOverlay" class="overlay hidden">
  <h1>時間到!</h1>
  <div id="finalScore">0</div>
  <div id="bestScore"></div>
  <button id="againBtn" class="big">再玩一次</button>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const startOverlay = document.getElementById("startOverlay");
const overOverlay = document.getElementById("overOverlay");
const statusEl = document.getElementById("status");

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// ---------- 音效(WebAudio 合成,無外部檔案) ----------
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}
function playSlice() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.12, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filt = audioCtx.createBiquadFilter(); filt.type = "bandpass";
  filt.frequency.setValueAtTime(2500, t); filt.frequency.exponentialRampToValueAtTime(900, t + 0.1);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
  src.connect(filt).connect(g).connect(audioCtx.destination); src.start();
}
function playBomb() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); osc.type = "sawtooth";
  osc.frequency.setValueAtTime(160, t); osc.frequency.exponentialRampToValueAtTime(40, t + 0.4);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.01, t + 0.45);
  osc.connect(g).connect(audioCtx.destination); osc.start(); osc.stop(t + 0.5);
}

// ---------- 手部追蹤 ----------
let landmarker = null;
async function loadModel() {
  statusEl.textContent = "載入手部追蹤模型中…(第一次會久一點)";
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2
  });
}
async function openCamera() {
  statusEl.textContent = "開啟攝影機中…";
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(res => { video.onloadedmetadata = () => { video.play(); res(); }; });
}

// 影像以 cover 方式鋪滿畫面(鏡像),landmark 也要用同一套換算
function videoRect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { dx: (W - dw) / 2, dy: (H - dh) / 2, dw, dh };
}
function mapLandmark(lm, r) {
  return { x: W - (r.dx + lm.x * r.dw), y: r.dy + lm.y * r.dh };
}

// ---------- 遊戲物件 ----------
const FRUITS = [
  { e: "🍉", juice: "#ff5b7f" }, { e: "🍎", juice: "#ff6b6b" },
  { e: "🍌", juice: "#ffe27a" }, { e: "🍊", juice: "#ffa94d" },
  { e: "🍓", juice: "#ff4d6d" }, { e: "🥝", juice: "#9acd32" },
  { e: "🍍", juice: "#ffd43b" }, { e: "🍑", juice: "#ffb3a7" }
];
const BOMB = "💣";

const emojiCache = new Map();
function emojiSprite(e, size) {
  const key = e + "@" + size;
  if (emojiCache.has(key)) return emojiCache.get(key);
  const c = document.createElement("canvas");
  c.width = c.height = size * 2;
  const cc = c.getContext("2d");
  cc.font = size * 1.6 + "px serif";
  cc.textAlign = "center"; cc.textBaseline = "middle";
  cc.fillText(e, size, size * 1.08);
  emojiCache.set(key, c);
  return c;
}
// 沿切割線把 emoji 剖成兩半
function halfSprites(e, size, angle) {
  const full = emojiSprite(e, size);
  const out = [];
  for (const side of [1, -1]) {
    const c = document.createElement("canvas");
    c.width = c.height = size * 2;
    const cc = c.getContext("2d");
    cc.save();
    cc.translate(size, size); cc.rotate(angle);
    cc.beginPath();
    cc.rect(-size * 1.5, side === 1 ? -size * 1.5 : 0.5, size * 3, size * 1.5);
    cc.clip();
    cc.rotate(-angle); cc.translate(-size, -size);
    cc.drawImage(full, 0, 0);
    cc.restore();
    out.push(c);
  }
  return out;
}

let fruits = [], halves = [], particles = [], popups = [], blades = [];
let score = 0, timeLeft = 60, state = "idle";
let spawnTimer = 0, gravity = 0, shake = 0, flash = 0;
let comboCount = 0, comboTimer = 0;
let lastFrame = 0, lastVideoTs = -1, results = null;

function fruitRadius() { return Math.max(34, Math.min(60, Math.min(W, H) * 0.075)); }

function spawnWave() {
  const n = 1 + (Math.random() < 0.55 ? 1 : 0) + (Math.random() < 0.25 ? 1 : 0);
  for (let i = 0; i < n; i++) {
    const isBomb = state === "play" && Math.random() < 0.12;
    const r = fruitRadius() * (isBomb ? 0.9 : (0.85 + Math.random() * 0.35));
    const x = W * (0.15 + Math.random() * 0.7);
    const peak = H * (0.5 + Math.random() * 0.35);
    const vy = -Math.sqrt(2 * gravity * peak);
    const vx = (W / 2 - x) * (0.2 + Math.random() * 0.5) / 1.5 + (Math.random() - 0.5) * W * 0.1;
    const f = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    fruits.push({
      x, y: H + r, vx, vy, r,
      emoji: isBomb ? BOMB : f.e, juice: isBomb ? "#666" : f.juice, isBomb,
      rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 4
    });
  }
}

function sliceFruit(f, angle, bladeVx, bladeVy) {
  if (f.isBomb) {
    score = Math.max(0, score - 30);
    popups.push({ x: f.x, y: f.y, text: "-30 💥", color: "#ff5252", t: 0 });
    flash = 1; shake = 1; playBomb();
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2, sp = 200 + Math.random() * 500;
      particles.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: 3 + Math.random() * 5, color: i % 2 ? "#ff9f43" : "#ff5252", t: 0, life: 0.7 });
    }
    return;
  }
  score += 10;
  comboCount++; comboTimer = 0.6;
  popups.push({ x: f.x, y: f.y - f.r, text: "+10", color: "#ffd166", t: 0 });
  playSlice();
  const [h1, h2] = halfSprites(f.emoji, f.r, angle);
  const px = Math.cos(angle + Math.PI / 2), py = Math.sin(angle + Math.PI / 2);
  const kick = 120 + Math.random() * 80;
  for (const [img, s] of [[h1, -1], [h2, 1]]) {
    halves.push({
      x: f.x, y: f.y, img,
      vx: f.vx * 0.6 + bladeVx * 0.1 + px * kick * s,
      vy: f.vy * 0.4 + bladeVy * 0.1 + py * kick * s,
      r: f.r, rot: f.rot, vrot: f.vrot + s * 3, t: 0
    });
  }
  for (let i = 0; i < 12; i++) {
    const a = angle + Math.PI / 2 * (Math.random() < 0.5 ? 1 : -1) + (Math.random() - 0.5);
    const sp = 100 + Math.random() * 350;
    particles.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100,
      r: 2.5 + Math.random() * 4.5, color: f.juice, t: 0, life: 0.6 + Math.random() * 0.3 });
  }
}

function segCircleHit(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((cx - x1) * dx + (cy - y1) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = x1 + t * dx - cx, py = y1 + t * dy - cy;
  return px * px + py * py <= r * r;
}

// ---------- 刀鋒(指尖軌跡) ----------
function updateBlades(now) {
  if (!results) return;
  const r = videoRect();
  const tips = [];
  for (const lms of (results.landmarks || [])) tips.push(mapLandmark(lms[8], r));

  const used = new Set();
  for (const tip of tips) {
    let best = null, bd = Infinity;
    for (const b of blades) {
      if (used.has(b)) continue;
      const p = b.pts[b.pts.length - 1];
      const d = Math.hypot(p.x - tip.x, p.y - tip.y);
      if (d < bd) { bd = d; best = b; }
    }
    if (best && bd < Math.min(W, H) * 0.3 && now - best.lastSeen < 250) {
      used.add(best);
      const prev = best.pts[best.pts.length - 1];
      const dt = (now - best.lastSeen) / 1000;
      best.pts.push({ x: tip.x, y: tip.y, t: now });
      best.lastSeen = now;
      if (dt > 0 && state === "play") {
        const dist = Math.hypot(tip.x - prev.x, tip.y - prev.y);
        const speed = dist / dt;
        const minSpeed = Math.min(W, H) * 1.1;   // 要揮得夠快才算切
        if (speed > minSpeed) {
          const angle = Math.atan2(tip.y - prev.y, tip.x - prev.x);
          const bvx = (tip.x - prev.x) / dt, bvy = (tip.y - prev.y) / dt;
          for (let i = fruits.length - 1; i >= 0; i--) {
            const f = fruits[i];
            if (segCircleHit(prev.x, prev.y, tip.x, tip.y, f.x, f.y, f.r)) {
              fruits.splice(i, 1);
              sliceFruit(f, angle, bvx, bvy);
            }
          }
        }
      }
    } else {
      const b = { pts: [{ x: tip.x, y: tip.y, t: now }], lastSeen: now };
      blades.push(b); used.add(b);
    }
  }
  for (const b of blades) b.pts = b.pts.filter(p => now - p.t < 160);
  blades = blades.filter(b => b.pts.length && now - b.lastSeen < 300);
}

function drawBlades(now) {
  for (const b of blades) {
    const pts = b.pts;
    if (pts.length >= 2) {
      for (const [width, color, alphaMul] of [[14, "rgba(140,220,255,", 0.35], [5, "rgba(255,255,255,", 0.9]]) {
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        for (let i = 1; i < pts.length; i++) {
          const age = (now - pts[i].t) / 160;
          ctx.strokeStyle = color + ((1 - age) * alphaMul) + ")";
          ctx.lineWidth = width * (1 - age * 0.6);
          ctx.beginPath();
          ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
          ctx.lineTo(pts[i].x, pts[i].y);
          ctx.stroke();
        }
      }
    }
    const tip = pts[pts.length - 1];
    ctx.beginPath();
    ctx.arc(tip.x, tip.y, 9, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.shadowColor = "#8fd3ff"; ctx.shadowBlur = 16;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// ---------- 主迴圈 ----------
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;

  if (video.readyState >= 2 && landmarker) {
    const ts = Math.round(now * 1000);
    if (ts > lastVideoTs) { results = landmarker.detectForVideo(video, ts); lastVideoTs = ts; }
  }

  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake * 24, (Math.random() - 0.5) * shake * 24);
    shake = Math.max(0, shake - dt * 3);
  }

  // 鏡像攝影機畫面
  if (video.readyState >= 2) {
    const r = videoRect();
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, r.dx, r.dy, r.dw, r.dh);
    ctx.restore();
    ctx.fillStyle = "rgba(10,12,26,0.25)";
    ctx.fillRect(-50, -50, W + 100, H + 100);
  }

  updateBlades(now);

  if (state === "play") {
    gravity = H * 2.0;
    timeLeft -= dt;
    spawnTimer -= dt;
    const interval = timeLeft > 40 ? 1.1 : timeLeft > 20 ? 0.85 : 0.65;
    if (spawnTimer <= 0) { spawnWave(); spawnTimer = interval; }

    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0 && comboCount >= 2) {
        const bonus = comboCount * 10;
        score += bonus;
        popups.push({ x: W / 2, y: H * 0.3, text: comboCount + " 連擊!+" + bonus, color: "#8fd3ff", t: 0, big: true });
      }
      if (comboTimer <= 0) comboCount = 0;
    }
    if (timeLeft <= 0) endGame();
  }

  // 水果物理與繪製
  for (let i = fruits.length - 1; i >= 0; i--) {
    const f = fruits[i];
    f.vy += gravity * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vrot * dt;
    if (f.y > H + f.r * 3 && f.vy > 0) { fruits.splice(i, 1); continue; }
    const img = emojiSprite(f.emoji, f.r);
    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(f.rot);
    ctx.drawImage(img, -f.r, -f.r, f.r * 2, f.r * 2);
    ctx.restore();
  }
  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.t += dt; h.vy += gravity * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.vrot * dt;
    if (h.t > 1.2 || h.y > H + h.r * 3) { halves.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - h.t / 1.2);
    ctx.translate(h.x, h.y); ctx.rotate(h.rot);
    ctx.drawImage(h.img, -h.r, -h.r, h.r * 2, h.r * 2);
    ctx.restore();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t > p.life) { particles.splice(i, 1); continue; }
    p.vy += gravity * 0.6 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.t += dt;
    if (p.t > 1) { popups.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - p.t;
    ctx.font = "bold " + (p.big ? 42 : 28) + "px 'Segoe UI', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = p.color;
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 4;
    ctx.strokeText(p.text, p.x, p.y - p.t * 50);
    ctx.fillText(p.text, p.x, p.y - p.t * 50);
    ctx.globalAlpha = 1;
  }

  drawBlades(now);

  // HUD
  if (state === "play") {
    ctx.font = "bold 30px 'Segoe UI', 'Microsoft JhengHei', sans-serif";
    ctx.textAlign = "left";
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 5;
    ctx.strokeText("🏆 " + score, 20, 46);
    ctx.fillStyle = "#ffd166";
    ctx.fillText("🏆 " + score, 20, 46);
    ctx.textAlign = "right";
    const tcol = timeLeft <= 10 ? "#ff5252" : "#8fd3ff";
    ctx.strokeText("⏱ " + Math.ceil(timeLeft), W - 20, 46);
    ctx.fillStyle = tcol;
    ctx.fillText("⏱ " + Math.ceil(timeLeft), W - 20, 46);
    if ((results?.landmarks?.length || 0) === 0) {
      ctx.textAlign = "center";
      ctx.font = "bold 20px 'Segoe UI', 'Microsoft JhengHei', sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.fillText("把手伸到鏡頭前面 ✋", W / 2, H - 40);
    }
  }

  if (flash > 0) {
    ctx.fillStyle = "rgba(255,80,60," + flash * 0.45 + ")";
    ctx.fillRect(-50, -50, W + 100, H + 100);
    flash = Math.max(0, flash - dt * 4);
  }
  ctx.restore();
}

function startGame() {
  fruits = []; halves = []; particles = []; popups = [];
  score = 0; timeLeft = 60; spawnTimer = 0.5;
  comboCount = 0; comboTimer = 0; flash = 0; shake = 0;
  state = "play";
  overOverlay.classList.add("hidden");
}
function endGame() {
  state = "over";
  fruits = [];
  const best = Math.max(score, +(localStorage.getItem("fn_best") || 0));
  localStorage.setItem("fn_best", best);
  document.getElementById("finalScore").textContent = score + " 分";
  document.getElementById("bestScore").textContent = "🏅 歷史最高:" + best + " 分";
  overOverlay.classList.remove("hidden");
}

document.getElementById("startBtn").addEventListener("click", async () => {
  const btn = document.getElementById("startBtn");
  btn.disabled = true;
  initAudio();
  try {
    await openCamera();
    await loadModel();
    statusEl.textContent = "";
    startOverlay.classList.add("hidden");
    lastFrame = performance.now();
    requestAnimationFrame(loop);
    startGame();
  } catch (err) {
    console.error(err);
    statusEl.textContent = "😢 無法啟動:" + (err.name === "NotAllowedError" ? "請允許攝影機權限後重試" : err.message);
    btn.disabled = false;
  }
});
document.getElementById("againBtn").addEventListener("click", () => { initAudio(); startGame(); });
</script>
</body>
</html>
